[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anylist-sdk"
version = "0.1.0"
description = "Async-first pure-Python client for AnyList, reconstructed from the official web application"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AnyList SDK contributors"}]
dependencies = [
  "aiohttp>=3.10",
  "protobuf>=5.27",
]

[project.optional-dependencies]
tui = [
  "textual>=0.70",
]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: opt-in tests against the real AnyList service; never collected by the default testpaths",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
# Runtime operation/response classes are selected from the embedded protobuf schema.
# Public protobuf classes are statically described by proto/__init__.pyi; the implementation
# deliberately retains dynamic Message attribute access in its low-level protocol machinery.
disable_error_code = ["attr-defined"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anylist_sdk = ["py.typed", "proto/schema.json", "proto/*.pyi", "official_surface.json", "data/*.json"]
