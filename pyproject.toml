[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aioanylist"
version = "1.0.0"
description = "Async-first pure-Python client for AnyList, reconstructed from the official web application"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "aioanylist contributors"}]
keywords = ["anylist", "asyncio", "grocery", "shopping-list", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.10",
  "protobuf>=5.27",
]

[project.urls]
Homepage = "https://github.com/BookCatKid/aioanylist"
Documentation = "https://github.com/BookCatKid/aioanylist/tree/main/docs"
Repository = "https://github.com/BookCatKid/aioanylist"
Issues = "https://github.com/BookCatKid/aioanylist/issues"

[project.optional-dependencies]
tui = [
  "textual>=0.70",
]
mcp = [
  "mcp>=2,<3",
]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "mypy>=1.11",
  "ruff>=0.16",
  "types-protobuf>=5.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: opt-in tests against the real AnyList service; never collected by the default testpaths",
]

[tool.ruff]
line-length = 100
# This file is deterministic generator output; formatting it independently makes
# tools/generate_proto_stubs.py --check report a false stale-stub failure.
extend-exclude = ["src/aioanylist/proto/__init__.pyi"]

[tool.mypy]
strict = true
# Runtime operation/response classes are selected from the embedded protobuf schema.
# Public protobuf classes are statically described by proto/__init__.pyi; the implementation
# deliberately retains dynamic Message attribute access in its low-level protocol machinery.
disable_error_code = ["attr-defined"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aioanylist = ["py.typed", "proto/schema.json", "proto/*.pyi", "official_surface.json", "data/*.json"]
